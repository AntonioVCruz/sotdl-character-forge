name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest run. Arquivos que leem rules/*.md ficam de fora quando o
      # corpus gitignored não está no checkout. Ver README, «Gate de CI».
      - name: Content privacy
        run: npm run curation:privacy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
