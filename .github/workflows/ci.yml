name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest run. Arquivos que leem rules/*.md ficam de fora quando o
      # corpus gitignored não está no checkout. Ver README, «Gate de CI».
      - name: Content privacy
        run: npm run curation:privacy

      - name: History privacy
        run: python3 tools/curation/history-audit.py . --require-clean

      - name: History audit regression tests
        run: python3 -m unittest discover -s tools/curation -p test_history_audit.py

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
